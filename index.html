// ─── STATE ───────────────────────────────────────────────────────────────────
let state = { watched: new Set() };

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function icon(path, cls = 'w-5 h-5') {
  return `<svg xmlns="http://www.w3.org/2000/svg" class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor">${path}</svg>`;
}

// ─── HEADER ──────────────────────────────────────────────────────────────────
function renderHeader(showTracker = false) {
  const pct = Math.round((state.watched.size / SECTIONS.length) * 100);
  return `
    <header class="shadow-md flex-shrink-0" style="background-color:#001e45; height:56px;">
      <div class="h-full px-4 flex items-center justify-between">
        <a href="#/" class="flex items-center gap-3 cursor-pointer">
          <img src="trueloyal-logo.png" alt="TrueLoyal" class="h-8 w-auto" style="mix-blend-mode:lighten" />
          <span class="text-white/40">|</span>
          <span class="text-white/70 text-sm font-medium">Training Hub</span>
        </a>
        <div class="flex items-center gap-3">
          ${showTracker ? `
            <div class="flex items-center gap-2.5">
              <div class="flex gap-0.5">
                ${SECTIONS.map(s => `<div class="h-1.5 w-5 rounded-full transition-all ${state.watched.has(s.id) ? 'bg-white' : 'bg-white/20'}"></div>`).join('')}
              </div>
              <span class="text-white/60 text-xs font-medium">${state.watched.size}/${SECTIONS.length}</span>
            </div>
          ` : `
            <div class="flex items-center gap-2">
              <div class="w-28 bg-white/20 rounded-full h-1.5">
                <div class="bg-white h-1.5 rounded-full transition-all" style="width:${pct}%"></div>
              </div>
              <span class="text-white/60 text-xs">${state.watched.size}/${SECTIONS.length}</span>
            </div>
          `}
        </div>
      </div>
    </header>
  `;
}

// ─── HOME ────────────────────────────────────────────────────────────────────
// Image reference dimensions: 1813 × 832 px
// Sidebar nav items: Home starts at y=112px, each slot is 44px (icon centers measured from image)
// Sidebar right edge at x≈250px; item left margin 5px, item width 240px
// All overlay positions expressed as % of image so they scale at any viewport width.
function renderHome() {
  const pct = Math.round((state.watched.size / SECTIONS.length) * 100);
  const allDone = state.watched.size === SECTIONS.length;

  const IMG_W = 1813, IMG_H = 832;
  const aspectPct = (IMG_H / IMG_W * 100).toFixed(4); // padding-top trick

  const overlays = SECTIONS.map((s, i) => {
    const watched = state.watched.has(s.id);
    const topPct  = ((112 + i * 44) / IMG_H * 100).toFixed(3);
    const leftPct = (5              / IMG_W * 100).toFixed(3);
    const wPct    = (240            / IMG_W * 100).toFixed(3);
    const hPct    = (40             / IMG_H * 100).toFixed(3);
    return `
      <a href="#/${s.id}" title="${s.title}"
        style="position:absolute; top:${topPct}%; left:${leftPct}%; width:${wPct}%; height:${hPct}%;
               border-radius:6px;
               border: 2px solid ${watched ? 'rgba(74,222,128,0.75)' : 'transparent'};
               background: ${watched ? 'rgba(74,222,128,0.22)' : 'transparent'};
               transition: border-color 0.15s, background 0.15s;
               box-sizing:border-box;">
      </a>`;
  }).join('');

  return `
    <div class="flex flex-col" style="min-height:100vh; background:#f3f4f6;">
      ${renderHeader()}

      <!-- Image + overlay wrapper -->
      <div style="position:relative; width:100%; padding-top:${aspectPct}%; background:#fff; overflow:hidden;">
        <img src="tl-admin-home.png" alt="TrueLoyal Admin Console"
          style="position:absolute; top:0; left:0; width:100%; height:100%; display:block; object-fit:fill;">

        <!-- White block over "TOTL Basketball" + GH avatar, anchored to right edge -->
        <div style="position:absolute; right:0; top:0; width:28%; height:7%; background:#ffffff; z-index:2; pointer-events:none; display:flex; align-items:center; justify-content:flex-end; padding-right:2%;">
          <span style="font-size:clamp(8px,1.1vw,14px); font-weight:500; color:#1e1e2e; white-space:nowrap;">Training Hub</span>
        </div>

        <!-- Nav overlays — percentage-positioned so they scale with the image -->
        ${overlays}

        <!-- Progress tracker — anchored to bottom-right of the screenshot's content area -->
        <div style="position:absolute; bottom:4%; right:2%; width:26%; max-width:420px; min-width:220px;">
          <div class="glass rounded-2xl shadow-2xl" style="padding:16px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
              <span style="font-weight:600; color:#1F2A44; font-size:13px;">${allDone ? 'Training complete!' : 'Your progress'}</span>
              <span style="color:#9ca3af; font-size:11px;">${state.watched.size} / ${SECTIONS.length}</span>
            </div>
            <div style="width:100%; background:#e5e7eb; border-radius:999px; height:6px; margin-bottom:12px;">
              <div style="width:${pct}%; background:#1F2A44; height:6px; border-radius:999px; transition:width 0.5s;"></div>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              ${SECTIONS.map(s => {
                const w = state.watched.has(s.id);
                return `<a href="#/${s.id}" style="font-size:11px; padding:2px 10px; border-radius:999px; border:1px solid ${w ? '#1F2A44' : '#d1d5db'}; background:${w ? '#1F2A44' : 'rgba(255,255,255,0.8)'}; color:${w ? '#fff' : '#4b5563'}; text-decoration:none; transition:all 0.15s;">${s.title}</a>`;
              }).join('')}
            </div>
            ${allDone ? '<p style="color:#16a34a; font-size:11px; margin-top:10px; font-weight:500;">All sections complete — your onboarding manager will be in touch.</p>' : ''}
          </div>
        </div>

      </div>
    </div>
  `;
}

// ─── SECTION ─────────────────────────────────────────────────────────────────
function renderSection(id) {
  const section = SECTIONS.find(s => s.id === id);
  if (!section) { window.location.hash = '/'; return ''; }

  const idx = SECTIONS.indexOf(section);
  const prev = SECTIONS[idx - 1];
  const next = SECTIONS[idx + 1];
  const watched = state.watched.has(id);

  return `
    <div class="min-h-screen bg-gray-50 flex flex-col">
      ${renderHeader(true)}
      <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-8">

        <!-- Breadcrumb -->
        <a href="#/" class="inline-flex items-center gap-1.5 text-sm text-[#001e45] hover:underline mb-6">
          ${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>', 'w-4 h-4')}
          Back to overview
        </a>

        <!-- Section label -->
        <div class="flex items-center gap-2 mb-4 text-sm text-gray-400">
          <span>Section ${idx + 1} of ${SECTIONS.length}</span>
          <span>·</span>
          <span>${section.duration}</span>
        </div>

        <!-- Video player -->
        ${section.video
          ? `<div class="rounded-2xl overflow-hidden mb-6 shadow-lg" style="aspect-ratio:16/9;">
               <iframe src="${section.video}" width="100%" height="100%" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" style="display:block;"></iframe>
             </div>`
          : `<div class="rounded-2xl overflow-hidden mb-6 shadow-lg" style="background:#1a1a2e; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;">
               <div class="text-center">
                 <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3" style="background:rgba(255,255,255,0.15)">
                   ${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>', 'w-8 h-8 text-white ml-1')}
                 </div>
                 <p class="text-white/50 text-sm">Video coming soon</p>
               </div>
             </div>`
        }

        <!-- Info card -->
        <div class="bg-white rounded-2xl p-6 shadow-sm mb-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:rgba(0,30,69,0.08)">
              <span class="text-[#001e45]">${icon(section.icon)}</span>
            </div>
            <h1 class="text-lg font-semibold text-[#001e45]">${section.title}</h1>
          </div>
          <p class="text-gray-500 text-sm leading-relaxed">${section.description}</p>
        </div>

        <!-- Mark watched -->
        <button data-mark="${id}" class="w-full py-3 rounded-xl font-medium text-sm mb-4 transition-all ${watched ? 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100' : 'bg-[#001e45] text-white hover:bg-[#002a5e]'}">
          ${watched
            ? `${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>', 'w-4 h-4 inline mr-1.5')} Marked as watched — click to undo`
            : `${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>', 'w-4 h-4 inline mr-1.5')} Mark as watched`}
        </button>

        <!-- Prev / Next -->
        <div class="flex gap-3">
          ${prev
            ? `<a href="#/${prev.id}" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-600 hover:border-[#001e45] hover:text-[#001e45] transition-all">
                ${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>', 'w-4 h-4')} ${prev.title}
              </a>`
            : `<div class="flex-1"></div>`
          }
          ${next
            ? `<a href="#/${next.id}" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gray-100 text-sm text-gray-700 hover:bg-gray-200 transition-all">
                ${next.title} ${icon('<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>', 'w-4 h-4')}
              </a>`
            : `<div class="flex-1"></div>`
          }
        </div>

      </main>
    </div>
  `;
}

// ─── ROUTER ──────────────────────────────────────────────────────────────────
function getRoute() {
  const hash = window.location.hash.replace('#', '') || '/';
  const parts = hash.split('/').filter(Boolean);
  if (!parts.length) return { page: 'home' };
  const section = SECTIONS.find(s => s.id === parts[0]);
  return section ? { page: 'section', id: parts[0] } : { page: 'home' };
}

function render() {
  const route = getRoute();
  const app = document.getElementById('app');
  app.innerHTML = route.page === 'section' ? renderSection(route.id) : renderHome();

  document.querySelectorAll('[data-mark]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.mark;
      state.watched.has(id) ? state.watched.delete(id) : state.watched.add(id);
      render();
      window.scrollTo(0, 0);
    });
  });
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
